# Explorer (Wander) nginx config snippet — installed in /etc/nginx/sites-enabled/default
# Add the /explorer/api/ block alongside the existing /explorer static block.

# /explorer/api/* → backend service
location /explorer/api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3700/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for — client-supplied XFF hops
    # must not become the rate-limit / ipFirstSeen key (finding #7895).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Existing static block — must keep try_files for SPA fallback so /explorer/<username>
# routes serve index.html and the SPA can read location.pathname.
#
# A location with its own add_header inherits NONE from server level (nginx
# add_header is all-or-nothing per context), so the site-wide security headers
# are re-listed here plus a Wander-scoped CSP. The page stores a cloud-backup
# bearer in localStorage / the URL fragment, loads Leaflet from unpkg, and
# fetches OSM/Esri tiles + Nominatim/Open-Meteo. Overpass is deliberately NOT in
# connect-src: POI and road pools are same-origin POSTs to /api/junctions/*,
# which 'self' already covers. 'unsafe-inline' is required: index.html wires
# controls via onclick= handlers, and Leaflet sets element.style.
# geolocation=(self) so "Use my location" keeps working (server-level
# Permissions-Policy sets geolocation=()). finding #7059.
location /explorer {
    alias /var/www/html/explorer;
    try_files $uri $uri/ /explorer/index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Not no-referrer: OSM's tile usage policy answers a Referer-less request
    # with a "403r Access blocked" tile (HTTP 200, so the map silently fills
    # with grey warning squares instead of erroring). strict-origin sends
    # "https://mase.fi/" and nothing more — no /explorer/<username> path, no
    # query, no #t=<token> fragment — and stays tighter than the rest of the
    # box, which is strict-origin-when-cross-origin.
    add_header Referrer-Policy "strict-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # img-src lists tile.openstreetmap.org both with and without the wildcard:
    # `https://*.tile.openstreetmap.org` requires a subdomain label, so it
    # matches Leaflet's {s} expansion (a/b/c) but refuses the bare host. OSM
    # operations and Leaflet's docs both steer clients off {s}, and a CSP-
    # refused tile is silent — grey squares, a console violation, no error.
    # tests/nginx-security.test.js derives this list from map-view.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com/leaflet@1.9.4/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com/leaflet@1.9.4/; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com/leaflet@1.9.4/; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://routing.openstreetmap.de https://api.open-meteo.com https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
