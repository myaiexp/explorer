# Self-hosted OSRM-foot proxy (Wander) — installed in /etc/nginx/sites-enabled/default
# Forwards mase.fi/api/osrm-fi/* to shelly's osrm-routed over Tailscale.
# OSRM does not set CORS headers, so they are added here.

location /api/osrm-fi/ {
    proxy_pass http://100.69.160.113:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # nginx's add_header doesn't inherit into `if` blocks, so the OPTIONS
    # response needs its own copies of the CORS headers.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        return 204;
    }
}
