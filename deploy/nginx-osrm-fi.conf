# Self-hosted OSRM-foot proxy (Wander) — installed in /etc/nginx/sites-enabled/default
# deploy-host: local
# deploy-into: /etc/nginx/sites-enabled/default
# Forwards mase.fi/api/osrm-fi/* to shelly's osrm-routed over Tailscale.
#
# osrm-routed emits a wildcard cross-origin header on every response and
# proxy_pass forwards it. That header is load-bearing: osrm.js calls this
# location by absolute URL, so a page that is not served from mase.fi (local
# python http.server) is cross-origin and needs it. nginx adds no
# cross-origin add_header of its own (it would duplicate the upstream one) and
# does not strip the upstream header; this file must not add one. The
# exhaustion control is limit_req zone=api below, not CORS. The body is public
# walking geometry.

location /api/osrm-fi/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://100.69.160.113:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
