# Self-hosted OSRM-foot proxy (Wander) — installed in /etc/nginx/sites-enabled/default
# Forwards mase.fi/api/osrm-fi/* to shelly's osrm-routed over Tailscale.
#
# Same-origin from https://mase.fi/wander — no CORS. A wildcard ACAO would let
# any website drive the Finland router; dropping it and rate-limiting like
# /wander/api/ closes that unauthenticated exhaustion path (finding #7060).

location /api/osrm-fi/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://100.69.160.113:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
