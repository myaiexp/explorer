# Path-only access log for /api/junctions/ (finding #7559).
# Installed in /etc/nginx/conf.d/ (http context) so the named format can
# be selected from the location block in sites-enabled/default.
# deploy-host: local
# deploy-as: /etc/nginx/conf.d/junctions-log-format.conf
#
# $uri is the path without query string. The default $request includes
# args and would persist startLat/startLng if a client still sent them
# on GET. The Wander client POSTs those in the body; this log format is
# the belt-and-suspenders so a leftover GET cannot write home coords to
# /var/log/nginx/mase.fi.access.log.

log_format junctions_no_qs '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
