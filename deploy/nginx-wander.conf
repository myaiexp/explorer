# Wander nginx config snippet — installed in /etc/nginx/sites-enabled/default
#
# /wander is the canonical prefix and owns everything. /explorer is kept
# permanently — a cloud-backup bearer travels between devices as
# /explorer/<username>#t=<token>, and those links have to keep working forever
# — but it owns nothing: it is an internal rewrite into /wander. The app reads
# either prefix and writes only /wander/ (sync-init.js, sync.js), so the address
# bar canonicalises on arrival.
#
# Routing and try_files only. Every security header lives in
# deploy/nginx-wander-headers.conf, installed at
# /etc/nginx/snippets/wander-headers.conf — see that file for why.

# /wander/api/* → backend service
location /wander/api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3700/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for — client-supplied XFF hops
    # must not become the rate-limit / ipFirstSeen key (finding #7895).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static SPA. try_files is load-bearing: cloud-backup links are
# /wander/<username>#t=<token>, and without the fallback nginx 404s instead of
# serving index.html, so the SPA never reads location.pathname.
#
# A plain prefix location, like every other project on this box: *.js/*.css are
# picked up by the regex asset locations at the end of the vhost (which set the
# $asset_cc immutable-if-?v= header) and served from the server-level
# `root /var/www/html`, which resolves correctly because the directory is
# literally named wander. The alias below only ever serves the HTML.
location /wander {
    alias /var/www/html/wander;
    try_files $uri $uri/ /wander/index.html;
    include /etc/nginx/snippets/wander-headers.conf;
}

# Legacy prefix. Bare /explorer carries no username and no fragment, so it can
# simply redirect.
location = /explorer {
    return 301 /wander/;
}

# Everything under /explorer/ is re-matched as /wander/ and handled by the
# blocks above — including /explorer/api/, which lands in the proxy with its
# rate limit and XFF overwrite intact.
#
# An INTERNAL rewrite, not a redirect: the browser's URL must stay put so the
# #t=<token> fragment and the username in the path reach the SPA exactly as
# sent, with no dependence on client redirect behaviour for a credential.
#
# ^~ is load-bearing. A regex location outranks a prefix location, so the
# `location ~* \.(css|js|…)$` blocks at the end of this vhost win against a
# plain `location /explorer` — which is how the earlier `alias` version broke:
# /explorer/sync.js was never served by the /explorer block at all, only ever
# from the server root, and 404'd the moment the webroot was renamed. ^~ stops
# the regex search, so the rewrite runs first and the asset is then found under
# its real /wander/ URI.
location ^~ /explorer/ {
    rewrite ^/explorer/(.*)$ /wander/$1 last;
}
