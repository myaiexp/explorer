# Wander nginx config snippet — installed in /etc/nginx/sites-enabled/default
#
# Both public prefixes serve the same SPA out of the same webroot, and both API
# prefixes proxy to the same backend. /explorer is kept permanently, not as a
# transition: a cloud-backup bearer token travels between devices as
# /explorer/<username>#t=<token>, and those links have to keep working forever.
# The app reads either prefix and writes only /wander/ (sync-init.js,
# sync.js), so the address bar canonicalises on arrival.
#
# Routing and try_files only. Every security header lives in
# deploy/nginx-wander-headers.conf, installed at
# /etc/nginx/snippets/wander-headers.conf — see that file for why.

# /wander/api/* → backend service
location /wander/api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3700/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for — client-supplied XFF hops
    # must not become the rate-limit / ipFirstSeen key (finding #7895).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /explorer/api/* → the same backend. Kept for pages loaded before the rename
# (their API_BASE is baked in at load time) and for any client that still holds
# the old prefix.
location /explorer/api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3700/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for — client-supplied XFF hops
    # must not become the rate-limit / ipFirstSeen key (finding #7895).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static SPA, canonical prefix. try_files is load-bearing: cloud-backup links
# are /wander/<username>#t=<token>, and without the fallback nginx 404s instead
# of serving index.html, so the SPA never reads location.pathname.
location /wander {
    alias /var/www/html/wander;
    try_files $uri $uri/ /wander/index.html;
    include /etc/nginx/snippets/wander-headers.conf;
}

# Static SPA, legacy prefix — same webroot, same headers, its own SPA fallback
# so /explorer/<username> still boots the app.
location /explorer {
    alias /var/www/html/wander;
    try_files $uri $uri/ /explorer/index.html;
    include /etc/nginx/snippets/wander-headers.conf;
}
