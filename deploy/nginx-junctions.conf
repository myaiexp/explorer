# wander-junctions proxy (Wander) — installed in /etc/nginx/sites-enabled/default
# Forwards mase.fi/api/junctions/* to shelly's Overpass cache over Tailscale.
#
# Same-origin from https://mase.fi/wander — no CORS. Rate-limited like
# /wander/api/ so a foreign origin cannot exhaust the cache (sibling of
# finding #7060).
#
# Start/radius used to travel on the GET query string and land in the
# default access_log at full JS precision (often home). The client now
# POSTs them in the body (finding #7559). access_log uses junctions_no_qs
# ($uri, no query) so a leftover GET still cannot persist coordinates.
# client_max_body_size 16k is plenty for the JSON lookup and stops this
# proxy being used as a large-body dump.
#
# log_format junctions_no_qs is defined in nginx-junctions-log-format.conf
# (http context, /etc/nginx/conf.d/).

location /api/junctions/ {
    limit_req zone=api burst=10;
    client_max_body_size 16k;
    access_log /var/log/nginx/mase.fi.access.log junctions_no_qs;
    proxy_pass http://100.69.160.113:5001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for — client-supplied XFF hops
    # must not become the per-IP rate-limit key (finding #7895).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
