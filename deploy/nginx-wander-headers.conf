# Wander's shared security-header set — installed at
# /etc/nginx/snippets/wander-headers.conf and `include`d by BOTH the /wander and
# /explorer static location blocks in /etc/nginx/sites-enabled/default.
# deploy-host: local
# deploy-as: /etc/nginx/snippets/wander-headers.conf
#
# This file exists because nginx `add_header` is all-or-nothing per context: a
# location with its own add_header inherits NONE from server level. Two static
# blocks would therefore mean two copies of this CSP, and a CSP that drifts
# between them is a silent hole — the weaker block wins for anyone using it,
# with no error anywhere. One copy, two includes, and tests/nginx-security.test.js
# asserts that neither block grew an add_header of its own.
#
# Contains add_header directives only: no location, no alias, no try_files, so
# it stays include-able inside any location context.
#
# The page stores a cloud-backup bearer in localStorage / the URL fragment,
# loads Leaflet from unpkg, and fetches OSM/Esri tiles + Nominatim/Open-Meteo.
# Overpass is deliberately NOT in connect-src: POI and road pools are
# same-origin POSTs to /api/junctions/*, which 'self' already covers.
# 'unsafe-inline' is required: index.html wires controls via onclick= handlers,
# and Leaflet sets element.style. geolocation=(self) so "Use my location" keeps
# working (server-level Permissions-Policy sets geolocation=()). finding #7059.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
# Not no-referrer: OSM's tile usage policy answers a Referer-less request
# with a "403r Access blocked" tile (HTTP 200, so the map silently fills
# with grey warning squares instead of erroring). strict-origin sends
# "https://mase.fi/" and nothing more — no /wander/<username> path, no
# query, no #t=<token> fragment — and stays tighter than the rest of the
# box, which is strict-origin-when-cross-origin.
add_header Referrer-Policy "strict-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
add_header Cache-Control "no-cache, must-revalidate" always;
# img-src lists tile.openstreetmap.org both with and without the wildcard:
# `https://*.tile.openstreetmap.org` requires a subdomain label, so it
# matches Leaflet's {s} expansion (a/b/c) but refuses the bare host. OSM
# operations and Leaflet's docs both steer clients off {s}, and a CSP-
# refused tile is silent — grey squares, a console violation, no error.
# tests/nginx-security.test.js derives this list from map-view.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com/leaflet@1.9.4/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com/leaflet@1.9.4/; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com/leaflet@1.9.4/; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://routing.openstreetmap.de https://api.open-meteo.com https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
