<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Wander</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="app">
        <!-- Top bar -->
        <div class="top-bar">
            <span class="brand">Wander</span>
            <div class="top-bar-right">
                <span class="visited-count" id="visitedCount">0 visited</span>
                <button type="button" class="overflow-btn" id="overflowBtn" onclick="toggleOverflowMenu()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>
                </button>
                <div class="overflow-menu" id="overflowMenu">
                    <button type="button" id="toggleVisitedBtn" onclick="toggleVisitedLayer()">Show visited routes</button>
                    <button type="button" onclick="exportVisits()">Export visits</button>
                    <button type="button" onclick="exportGPX()">Export GPX</button>
                    <button type="button" onclick="document.getElementById('importInput').click()">Import visits</button>
                    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importVisits(event)">
                </div>
            </div>
        </div>

        <!-- Main content -->
        <div class="main">
            <!-- Map -->
            <div class="map-area">
                <div id="map"></div>
            </div>

            <!-- Controls panel -->
            <div class="panel">
                <div class="panel-scroll">
                    <div class="input-group">
                        <label for="location">Starting location</label>
                        <div class="location-row">
                            <input type="text" id="location"
                                placeholder="Address or coordinates">
                            <button type="button" class="icon-btn" id="saveLocationBtn"
                                onclick="toggleSaveLocation()" title="Save this location">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            </button>
                            <button type="button" class="icon-btn" id="useLocationBtn"
                                onclick="useMyLocation()" title="Use my location">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
                            </button>
                        </div>
                        <div class="saved-locations" id="savedLocations"></div>
                    </div>

                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="tripMode" id="roundTrip" value="round" checked>
                            <span>Round trip</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="tripMode" id="oneWay" value="one-way">
                            <span>One way</span>
                        </label>
                    </div>

                    <div class="action-row">
                        <button type="button" class="btn-primary" id="generateBtn" onclick="generateDestination()">Walk to a random...</button>
                        <button type="button" class="btn-ghost" id="surpriseBtn" onclick="surpriseMe()" title="Random POI type and distance">Surprise me</button>
                    </div>

                    <select id="locationTypeSelect" class="poi-select"></select>

                    <div class="input-group">
                        <label id="distanceLabel">Round-trip distance (km)</label>
                        <div class="distance-row">
                            <div class="distance-field">
                                <div class="num-input">
                                    <input type="number" id="minDistance" min="0" max="100" step="0.5" value="0" placeholder="Min">
                                    <div class="num-btns">
                                        <button type="button" class="num-btn" onclick="stepNumInput('minDistance',0.5)" tabindex="-1">&plus;</button>
                                        <button type="button" class="num-btn" onclick="stepNumInput('minDistance',-0.5)" tabindex="-1">&minus;</button>
                                    </div>
                                </div>
                            </div>
                            <span class="distance-sep">&ndash;</span>
                            <div class="distance-field">
                                <div class="num-input">
                                    <input type="number" id="maxDistance" min="0.5" max="100" step="0.5" value="5" placeholder="Max">
                                    <div class="num-btns">
                                        <button type="button" class="num-btn" onclick="stepNumInput('maxDistance',0.5)" tabindex="-1">&plus;</button>
                                        <button type="button" class="num-btn" onclick="stepNumInput('maxDistance',-0.5)" tabindex="-1">&minus;</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="spreadSlider">Route spread</label>
                        <div class="slider-row">
                            <button type="button" class="spread-adj" onclick="adjustSpread(-5)">&minus;</button>
                            <span class="slider-label">Direct</span>
                            <input type="range" id="spreadSlider" min="0" max="100" value="50" step="5">
                            <span class="slider-label">Wide</span>
                            <button type="button" class="spread-adj" onclick="adjustSpread(5)">+</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="delaySlider">Request delay</label>
                        <div class="slider-row">
                            <button type="button" class="spread-adj" onclick="adjustRequestDelay(-100)">&minus;</button>
                            <input type="range" id="delaySlider" min="0" max="2000" value="300" step="100" oninput="requestDelay=+this.value; document.getElementById('delayValue').textContent=this.value+'ms'">
                            <span class="slider-label" id="delayValue">300ms</span>
                            <button type="button" class="spread-adj" onclick="adjustRequestDelay(100)">+</button>
                        </div>
                    </div>

                    <button type="button" class="btn-ghost btn-full" id="pickDestBtn" onclick="togglePickMode()">Pick on map</button>

                    <div class="loading" id="loading">
                        <div class="loading-pulse"></div>
                        <p>Finding your random destination...</p>
                    </div>

                    <div class="error" id="error"></div>

                    <!-- Result card (inside panel) -->
                    <div class="result-card" id="resultPanel">
                        <div class="result-header">Destination</div>
                        <div class="dest-name" id="destName"></div>
                        <div class="coordinates" id="destCoords"></div>
                        <span class="badge badge-dist" id="distanceBadge"></span>
                        <div class="badges-row">
                            <span class="badge badge-time" id="walkBadge" style="display:none"></span>
                            <span class="badge badge-bike" id="bikeBadge" style="display:none"></span>
                            <span class="badge badge-car" id="carBadge" style="display:none"></span>
                        </div>
                        <div class="links-row">
                            <a href="#" id="directionsLink" class="btn-directions" target="_blank">
                                Directions
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
                            </a>
                            <a href="#" id="streetViewLink" target="_blank">Street View</a>
                            <button type="button" class="link-icon-btn" onclick="copyRouteLink()" title="Copy link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                            </button>
                        </div>
                        <div class="elevation-container" id="elevationContainer"></div>
                        <div class="result-actions">
                            <button type="button" class="btn-visited" id="markVisitedBtn" onclick="markAsVisited()">Mark as visited</button>
                            <button type="button" class="btn-favorite" id="favoriteBtn" onclick="toggleFavorite()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Favorites section -->
                    <div class="history-section" id="favoritesSection">
                        <div class="history-header">Favorites</div>
                        <div class="history-list" id="favoritesList"></div>
                    </div>

                    <!-- History section -->
                    <div class="history-section" id="historySection">
                        <div class="history-header">Recent</div>
                        <div class="history-list" id="historyList"></div>
                        <button type="button" class="history-more" id="historyMoreBtn" onclick="toggleHistoryExpanded()"></button>
                    </div>

                    <p class="explored-count" id="exploredCount" style="display:none"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=3" defer></script>
</body>
</html>
